services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ticket_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/var/www/html
      - backend_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ticket
      DB_USERNAME: ticket
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticket_network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: ticket_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - ticket_network

  mysql:
    image: mysql:8.0
    container_name: ticket_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ticket
      MYSQL_USER: ticket
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ticket", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket_network

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local

networks:
  ticket_network:
    driver: bridge

